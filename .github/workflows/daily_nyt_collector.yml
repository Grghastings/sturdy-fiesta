name: Daily NYT Article Collector

on:
  schedule:
    # Runs daily at 06:00 UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Grants permission to commit back to the repo

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python fetch_nyt.py

      - name: Commit and Push Updated JSON File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nyt_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: daily NYT articles" && git push)
