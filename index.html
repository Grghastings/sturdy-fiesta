<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYT - This Day in History</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 { border-bottom: 2px solid #222; padding-bottom: 10px; }
    .year-header {
      margin-top: 30px;
      color: #b91c1c;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }
    .article-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }
    .article-card h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
    .article-card a { color: #111; text-decoration: none; }
    .article-card a:hover { text-decoration: underline; }
    .meta { font-size: 0.85rem; color: #666; margin-bottom: 8px; }
    .snippet { font-size: 0.95rem; line-height: 1.4; color: #444; }
  </style>
</head>
<body>

  <h1>This Day in NYT History</h1>
  <div id="articles-container">Loading articles...</div>

  <script>
    async function loadArticles() {
      const container = document.getElementById('articles-container');
      try {
        const response = await fetch('./nyt_articles.json');
        if (!response.ok) throw new Error('Could not load nyt_articles.json');
        
        const articles = await response.json();
        if (articles.length === 0) {
          container.innerHTML = '<p>No historical articles found for today\'s date with this topic filter.</p>';
          return;
        }

        // Group articles by historical year
        const grouped = {};
        articles.forEach(art => {
          const yr = art.historical_year || new Date(art.pub_date).getFullYear();
          if (!grouped[yr]) grouped[yr] = [];
          grouped[yr].push(art);
        });

        // Sort years descending
        const years = Object.keys(grouped).sort((a, b) => b - a);

        container.innerHTML = years.map(yr => `
          <h2 class="year-header">${yr}</h2>
          ${grouped[yr].map(art => `
            <div class="article-card">
              <h3><a href="${art.url}" target="_blank" rel="noopener">${art.headline}</a></h3>
              <div class="meta">
                <span>Section: ${art.section || 'General'}</span>
              </div>
              <p class="snippet">${art.snippet || 'No snippet available.'}</p>
            </div>
          `).join('')}
        `).join('');

      } catch (err) {
        container.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
      }
    }

    loadArticles();
  </script>
</body>
</html>
